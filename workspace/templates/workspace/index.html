<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Architect 2.0 - Vibe Coding Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="border-b border-gray-800 px-6 py-3 flex justify-between items-center bg-gray-950">
        <div class="flex items-center space-x-3">
            <span class="font-bold text-xl text-indigo-400">Architect 2.0</span>
            <span class="text-xs bg-indigo-900 text-indigo-200 px-2 py-0.5 rounded">Technical + Executive</span>
        </div>
        <div class="flex space-x-4">
            <button id="connectGithub" class="bg-gray-800 hover:bg-gray-700 text-sm px-3 py-1.5 rounded border border-gray-700">
                🐙 Connect GitHub
            </button>
            <button id="deployApp" class="bg-indigo-600 hover:bg-indigo-500 text-sm px-4 py-1.5 rounded font-semibold">
                🚀 Deploy App
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Chat & Prompt Panel -->
        <aside class="w-1/3 border-r border-gray-800 flex flex-col bg-gray-950">
            <div class="p-4 border-b border-gray-800 font-semibold text-gray-300">
                Agentic Prompt Studio
            </div>
            <div id="chatFeed" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
                <div class="bg-gray-800 p-3 rounded text-gray-300">
                    <strong>Architect:</strong> Describe what app or multi-agent pipeline you'd like to build.
                </div>
            </div>
            <div class="p-4 border-t border-gray-800">
                <textarea id="promptInput" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-sm focus:outline-none focus:border-indigo-500" rows="3" placeholder="Build an agentic support dashboard with GitHub sync..."></textarea>
                <button id="submitPrompt" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-500 py-2 text-sm font-medium rounded">Generate App & Agents</button>
            </div>
        </aside>

        <!-- Main Panel: Toggleable Code / Canvas Preview -->
        <main class="flex-1 flex flex-col bg-gray-900">
            <div class="border-b border-gray-800 px-4 py-2 flex space-x-4 text-sm bg-gray-950">
                <button class="font-semibold text-indigo-400 border-b-2 border-indigo-400 pb-1">🎨 Visual UI Preview</button>
                <button class="text-gray-400 hover:text-gray-200 pb-1">💻 Generated Code & Agents</button>
                <button class="text-gray-400 hover:text-gray-200 pb-1">⚡ Logs & Terminal</button>
            </div>
            <div id="previewCanvas" class="flex-1 p-6 overflow-y-auto flex items-center justify-center border-2 border-dashed border-gray-800 m-4 rounded">
                <p class="text-gray-500">Your live canvas and generated agent interface will render here...</p>
            </div>
        </main>

    </div>

    <script>
        // Interactive state handlers for the assignment demo
        document.getElementById('submitPrompt').addEventListener('click', async () => {
            const prompt = document.getElementById('promptInput').value;
            if(!prompt) return;

            const chatFeed = document.getElementById('chatFeed');
            chatFeed.innerHTML += `<div class="bg-indigo-950 border border-indigo-800 p-3 rounded"><strong>You:</strong> ${prompt}</div>`;
            document.getElementById('promptInput').value = '';

            // Simulate generation response
            setTimeout(() => {
                chatFeed.innerHTML += `<div class="bg-gray-800 p-3 rounded text-gray-300"><strong>Architect:</strong> Configured multi-agent workflow and built real-time UI components.</div>`;
                document.getElementById('previewCanvas').innerHTML = `
                    <div class="w-full h-full bg-gray-950 p-6 rounded border border-gray-800 text-left">
                        <h2 class="text-xl font-bold text-indigo-400 mb-2">Live Application Canvas</h2>
                        <p class="text-sm text-gray-400 mb-4">Agent framework: LangChain / Lyzr | Status: Active</p>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-gray-900 p-4 rounded border border-gray-800">
                                <h3 class="font-semibold">Agent 1: Support Bot</h3>
                                <p class="text-xs text-gray-500 mt-1">Status: Listening to incoming tickets</p>
                            </div>
                            <div class="bg-gray-900 p-4 rounded border border-gray-800">
                                <h3 class="font-semibold">Agent 2: Code Reviewer</h3>
                                <p class="text-xs text-gray-500 mt-1">Status: Linked to GitHub PRs</p>
                            </div>
                        </div>
                    </div>
                `;
            }, 1000);
        });
    </script>
</body>
</html>
